              <span><strong>Check 2: Clean Architecture:</strong> Dominio y aplicación 100% aislados.</span>
              <span class="text-emerald-400 font-bold">✓ Arch OK</span>
            </div>
            <div class="p-2 rounded-lg bg-[var(--background)] border border-[var(--border)] flex items-center justify-between">
              <span><strong>Check 3: Allowed Dependencies:</strong> Cero paquetes sorpresa no declarados.</span>
              <span class="text-emerald-400 font-bold">✓ Deps OK</span>
            </div>
            <div class="p-2 rounded-lg bg-[var(--background)] border border-[var(--border)] flex items-center justify-between">
              <span><strong>Check 4: BDD Traceability:</strong> Cada AC-x.x tiene tag @AC-x.x en feature.</span>
              <span class="text-emerald-400 font-bold">✓ BDD OK</span>
            </div>
            <div class="p-2 rounded-lg bg-[var(--background)] border border-[var(--border)] flex items-center justify-between">
              <span><strong>Check 5: Health & Tests:</strong> Suite de pruebas y tipado pasan al 100%.</span>
              <span class="text-emerald-400 font-bold">✓ Tests OK</span>
            </div>
            <div class="p-2 rounded-lg bg-[var(--background)] border border-[var(--border)] flex items-center justify-between">
              <span><strong>Check 6: User Guide Compliance:</strong> docs/user_guide_...md estructurado.</span>
              <span class="text-emerald-400 font-bold">✓ Guide OK</span>
            </div>
            <div class="p-2 rounded-lg bg-[var(--background)] border border-[var(--border)] flex items-center justify-between">
              <span><strong>Check 7: UI/UX Compliance:</strong> Sección de UI/UX válida en plan.md.</span>
              <span class="text-emerald-400 font-bold">✓ UI/UX OK</span>
            </div>
          </div>
          <div class="mt-3 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-400 font-semibold flex items-center justify-between">
            <span>🎉 SUPERADO EL AUDITOR SÉPTUPLE</span>
            <span class="font-mono text-[11px] bg-emerald-500/20 px-2 py-0.5 rounded">status: "done"</span>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    function renderSlide(index) {
      const s = slides[index];
      const container = document.getElementById("slideContent");
      
      // Update header counter & progress bar
      document.getElementById("slideCounter").textContent = `${index + 1} / ${slides.length}`;
      document.getElementById("progressBar").style.width = `${((index + 1) / slides.length) * 100}%`;
      
      // Render Content
      container.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-blue-500">${s.phase}</span>
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ${s.badgeColor}">
            ${s.badge}
          </span>
        </div>
        <h2 class="text-xl sm:text-2xl font-bold text-[var(--foreground)] tracking-tight">${s.title}</h2>
        <p class="text-xs sm:text-sm text-[var(--muted-foreground)] mt-1 mb-3">${s.subtitle}</p>
        <div class="mt-3">
          ${s.content}
        </div>
      `;

      // Update Navigation Buttons
      document.getElementById("prevBtn").disabled = (index === 0);
      const nextBtn = document.getElementById("nextBtn");
      if (index === slides.length - 1) {
        nextBtn.innerHTML = `Reiniciar <span>↻</span>`;
      } else {
        nextBtn.innerHTML = `Siguiente <span>→</span>`;
      }

      // Render Dots
      const dots = document.getElementById("dotsContainer");
      dots.innerHTML = slides.map((_, i) => `
        <button onclick="goToSlide(${i})" class="w-2.5 h-2.5 rounded-full transition-all ${
          i === index ? 'bg-blue-500 w-5' : 'bg-[var(--border)] hover:bg-[var(--muted-foreground)]'
        }" title="Diapositiva ${i + 1}"></button>
      `).join("");
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
      } else {
        currentSlide = 0;
      }
      renderSlide(currentSlide);
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
      }
    }

    function goToSlide(i) {
      currentSlide = i;
      renderSlide(currentSlide);
    }

    // Keyboard Navigation (Arrow Keys)
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "Space") {
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        prevSlide();
      }
    });

    // Initial render
    renderSlide(0);
  </script>
</body>
</html>
